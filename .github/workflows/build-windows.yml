name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name N64AssetStudio
          --icon assets\icon.ico
          --add-data "assets\icon.ico;assets"
          --add-data "assets\icon.png;assets"
          main.py

      - name: Smoke test the executable (CLI mode)
        shell: pwsh
        run: |
          python tests\make_test_rom.py smoke
          $p = Start-Process -FilePath dist\N64AssetStudio.exe -ArgumentList "--cli","export","smoke\test.v64","smoke_out","--models","fbx","--unity" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe failed with $($p.ExitCode)" }
          if (-not (Test-Path smoke_out\N64STUDIO_TEST.unitypackage)) { throw "no unitypackage produced" }

      - uses: actions/upload-artifact@v4
        with:
          name: N64AssetStudio-windows
          path: dist/N64AssetStudio.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/N64AssetStudio.exe
