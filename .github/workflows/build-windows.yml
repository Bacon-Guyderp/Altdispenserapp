name: Build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet test tests/N64AssetStudio.Tests -c Release

      - name: Publish self-contained single-file exe
        run: dotnet publish src/N64AssetStudio -c Release -o publish

      - name: Build test ROM
        run: dotnet run --project src/N64AssetStudio.Cli -c Release -- make-test-rom smoke

      - name: Smoke test the exe (command line)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\N64AssetStudio.exe -ArgumentList "--cli","export","smoke\test.v64","smoke_out","--models","fbx","--unity" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exe failed with $($p.ExitCode)" }
          if (-not (Test-Path smoke_out\N64STUDIO_TEST.unitypackage)) { throw "no unitypackage produced" }

      - name: Smoke test the exe (GUI self-test)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest | Out-Null
          $p = Start-Process -FilePath publish\N64AssetStudio.exe -ArgumentList "--selftest","smoke\test.z64","selftest" -Wait -PassThru
          Get-Content selftest\selftest_result.txt
          if ($p.ExitCode -ne 0) { throw "GUI self-test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: N64AssetStudio-windows
          path: publish/N64AssetStudio.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-selftest-screenshots
          path: selftest/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/N64AssetStudio.exe
