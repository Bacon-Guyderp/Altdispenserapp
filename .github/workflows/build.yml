name: Build Blend2Unity.exe

on:
  push:
    branches: ["**"]
    tags: ["blend2unity-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o Blend2Unity.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Blend2Unity
          path: Blend2Unity.exe
      # Pushing a tag like blend2unity-v1.0.0 publishes a GitHub Release with the exe.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/blend2unity-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#blend2unity-v}"
          cat > notes.md <<NOTES
          **Blend2Unity $VERSION**: converts Blender \`.blend\` files to Unity \`.unitypackage\` files.

          1. Download **Blend2Unity.exe** below. It's a native Windows 10/11 app with nothing to install.
          2. Install [Blender](https://www.blender.org/download/) if you don't have it. The app uses it to read \`.blend\` files.
          3. Run the exe, add your \`.blend\` files, and click **Convert**.

          Windows may say "Windows protected your PC" because the exe isn't code-signed. Click **More info → Run anyway**.
          NOTES
          gh release create "$TAG" Blend2Unity.exe --title "Blend2Unity $VERSION" --notes-file notes.md --latest=false \
            || gh release upload "$TAG" Blend2Unity.exe --clobber
