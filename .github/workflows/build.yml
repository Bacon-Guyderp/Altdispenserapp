name: Build Blend2Unity.exe

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o Blend2Unity.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Blend2Unity
          path: Blend2Unity.exe
      - name: Attach to release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" Blend2Unity.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
