<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}</style></head><body>
<script type="module">
import * as THREE from './three.module.min.js';
let texturesLoaded = false;
THREE.DefaultLoadingManager.onLoad = () => { texturesLoaded = true; };
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0);
const camera = new THREE.PerspectiveCamera(75, W / H, 0.02, 120);

// ---- port of Shaders/FirLantern.shader
const G = { reach: { value: 6 }, dark: { value: 0 }, amb: { value: 0.004 } };
const loader = new THREE.TextureLoader();
function tex(n, rx = 1, ry = 1) { const t = loader.load(n); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; }
const white = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1); white.needsUpdate = true;
function lantern(o = {}) {
  return new THREE.ShaderMaterial({
    vertexColors: !!o.vc,
    uniforms: { map: { value: o.map || white }, rep: { value: o.map ? o.map.repeat : new THREE.Vector2(1, 1) },
      color: { value: new THREE.Color(...(o.color || [1, 1, 1])) }, full: { value: o.full || 0 },
      glow: { value: new THREE.Color(...(o.glow || [0, 0, 0])) }, useVC: { value: o.vc ? 1 : 0 },
      reach: G.reach, dark: G.dark, amb: G.amb },
    vertexShader: `varying vec2 vUv; varying vec3 wpos; varying vec3 wn; varying vec3 vc; uniform vec2 rep;
      void main(){ vUv = uv * rep; vec4 w = modelMatrix * vec4(position,1.); wpos = w.xyz; wn = normalize(mat3(modelMatrix) * normal);
      #ifdef USE_COLOR
        vc = color;
      #else
        vc = vec3(1.);
      #endif
      gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform sampler2D map; uniform vec3 color; uniform float full; uniform vec3 glow; uniform float useVC;
      uniform float reach; uniform float dark; uniform float amb; varying vec2 vUv; varying vec3 wpos; varying vec3 wn; varying vec3 vc;
      void main(){ vec3 albedo = texture2D(map, vUv).rgb * color * mix(vec3(1.), vc, useVC);
        vec3 toS = wpos - cameraPosition; float d = length(toS); vec3 dir = toS / max(d, 1e-4);
        float fall = clamp(1. - d / reach, 0., 1.); fall *= fall;
        vec3 camFwd = -vec3(viewMatrix[0][2], viewMatrix[1][2], viewMatrix[2][2]);
        float cone = smoothstep(0.55, 0.92, dot(dir, camFwd));
        float facing = clamp(dot(normalize(wn), -dir), 0., 1.) * 0.6 + 0.4;
        float light = (0.006 + amb) + fall * facing * (0.3 + 0.9 * cone);
        light *= 1. - clamp(dark, 0., 1.);
        vec3 col = mix(albedo * light, albedo, full) + glow;
        gl_FragColor = vec4(pow(col, vec3(1.0/2.2)), 1.); }`
  });
}

// ---- port of FirWorldBuilder.FirMesh (stacked jagged cones)
function firMesh(tiers, height, radius, seg, jag) {
  const pos = [], col = [], uv = [];
  const tierH = height / (tiers * 0.7 + 0.3);
  function tri(a, b, c, out, sa, sb) {
    const ab = b.clone().sub(a), ac = c.clone().sub(a);
    if (ab.cross(ac).dot(out) < 0) { const t = b; b = c; c = t; }
    for (const [p, sh] of [[a, sa], [b, sb], [c, sb]]) {
      pos.push(p.x, p.y, p.z); col.push(sh, sh, sh);
      uv.push((Math.atan2(p.z, p.x) / (Math.PI * 2) + 0.5) * 3, p.y / height * 3);
    }
  }
  for (let k = 0; k < tiers; k++) {
    const y0 = k * tierH * 0.7, y1 = Math.min(height, y0 + tierH), r = radius * (1 - k / (tiers + 0.4));
    const apex = new THREE.Vector3(0, y1, 0), inner = new THREE.Vector3(0, y0 + tierH * 0.25, 0), pts = seg * 2;
    for (let i = 0; i < pts; i++) {
      const a0 = i * Math.PI * 2 / pts, a1 = (i + 1) * Math.PI * 2 / pts;
      const r0 = i % 2 == 0 ? r : r * jag, r1 = (i + 1) % 2 == 0 ? r : r * jag;
      const d0 = i % 2 == 0 ? -tierH * 0.06 : 0, d1 = (i + 1) % 2 == 0 ? -tierH * 0.06 : 0;
      const p0 = new THREE.Vector3(Math.cos(a0) * r0, y0 + d0, Math.sin(a0) * r0);
      const p1 = new THREE.Vector3(Math.cos(a1) * r1, y0 + d1, Math.sin(a1) * r1);
      const out = new THREE.Vector3(Math.cos((a0 + a1) / 2), 0.3, Math.sin((a0 + a1) / 2));
      tri(apex, p0, p1, out, 1, 0.55);
      tri(inner, p1, p0, new THREE.Vector3(0, -1, 0), 0.3, 0.45);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
const sphere = new THREE.SphereGeometry(0.5, 24, 16), cyl = new THREE.CylinderGeometry(0.5, 0.5, 2, 24);
const M = {
  needles: lantern({ map: tex('needles.png'), vc: true }), pot: lantern({ color: [0.55, 0.12, 0.1] }), trunk: lantern({ color: [0.3, 0.2, 0.12] }),
  eye: lantern({ color: [0.9, 0.9, 0.85], glow: [0.22, 0.22, 0.2] }), pupil: lantern({ color: [0.01, 0.01, 0.01], full: 1 }),
  mouth: lantern({ color: [0.7, 0.05, 0.08], glow: [0.08, 0, 0] }), black: lantern({ color: [0.03, 0.03, 0.03] }),
  red: lantern({ color: [0.6, 0, 0], full: 1, glow: [0.9, 0.05, 0.02] }), teeth: lantern({ color: [0.85, 0.82, 0.7], glow: [0.08, 0.07, 0.05] }),
  wall: lantern({ map: tex('wallpaper.png', 3, 2) }), floor: lantern({ map: tex('wood_floor.png', 3, 7) }), ceil: lantern({ map: tex('ceiling.png', 3, 7) }),
  poster: lantern({ map: loader.load('poster_warning_scrawl.png') }), cloth: lantern({ color: [0.45, 0.07, 0.08] }),
};
// ---- port of FirWorldBuilder.BuildTree (face looks along +z)
function buildTree(height) {
  const root = new THREE.Group();
  const potH = Math.max(0.08, height * 0.09), trunkH = height * 0.08, canopyH = height - potH - trunkH, radius = height * 0.36;
  const add = (geo, mat, p, s, parent = root) => { const m = new THREE.Mesh(geo, mat); m.position.set(...p); m.scale.set(...s); parent.add(m); return m; };
  add(cyl, M.pot, [0, potH / 2, 0], [radius * 0.55, potH / 2, radius * 0.55]);
  add(cyl, M.trunk, [0, potH + trunkH / 2, 0], [radius * 0.18, trunkH / 2 + 0.02, radius * 0.18]);
  const head = new THREE.Group(); head.position.set(0, potH + trunkH, 0); root.add(head);
  const tiers = Math.min(6, Math.max(3, Math.round(height * 2.2)));
  head.add(new THREE.Mesh(firMesh(tiers, canopyH, radius, 14, 0.7), M.needles));
  const faceY = canopyH * 0.5, rAt = radius * (1 - faceY / canopyH) * 1.05, eye = Math.max(0.035, canopyH * 0.055), faceZ = rAt * 0.92;
  for (const sx of [-1, 1]) {
    add(sphere, M.eye, [sx * eye * 1.25, faceY + eye * 1.1, faceZ], [eye * 2, eye * 2, eye * 2], head);
    add(sphere, M.pupil, [sx * eye * 1.25, faceY + eye * 1.1, faceZ + eye * 0.85], [eye * 0.8, eye * 0.8, eye * 0.8], head);
  }
  const mouth = new THREE.Group(); mouth.position.set(0, faceY - eye * 1.4, faceZ - eye * 0.2); head.add(mouth);
  add(sphere, M.mouth, [0, 0, 0], [eye * 3.2, eye * 1.6, eye * 1.2], mouth);
  add(sphere, M.black, [0, 0, eye * 0.25], [eye * 2.4, eye * 1.1, eye * 0.9], mouth);
  const tooth = firMesh(1, eye * 0.55, eye * 0.16, 5, 1);
  for (let row = 0; row < 2; row++) for (let k = 0; k < 6; k++) {
    const m = new THREE.Mesh(tooth, M.teeth); m.position.set((-1.05 + k * 0.42) * eye, (row == 0 ? 0.42 : -0.42) * eye, eye * 0.5);
    if (row == 0) m.rotation.x = Math.PI; mouth.add(m);
  }
  const redEyes = new THREE.Group(); redEyes.visible = false; head.add(redEyes);
  for (const sx of [-1, 1]) add(sphere, M.red, [sx * eye * 1.25, faceY + eye * 1.1, faceZ + eye * 0.95], [eye * 0.75, eye * 0.75, eye * 0.75], redEyes);
  return { root, head, mouth, redEyes, faceHeight: potH + trunkH + faceY, faceZ };
}

// ---- the Living Room corner with the closet (port of FirWorldBuilder.BuildSkeletonCloset / SkeletonRig; door faces +x)
const box = (mat, p, sz, parent = scene) => { const m = new THREE.Mesh(new THREE.BoxGeometry(...sz), mat); m.position.set(...p); parent.add(m); return m; };
const prim = (geo, mat, p, s, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(...p); m.scale.set(...s); parent.add(m); return m; };
const group = (parent, p) => { const g = new THREE.Group(); g.position.set(...p); parent.add(g); return g; };
const X = {
  wood: lantern({ map: tex('wood_floor.png', 4, 4) }), desk: lantern({ map: tex('wood_floor.png', 1, 2), color: [0.8, 0.7, 0.6] }),
  wall: lantern({ map: tex('wallpaper.png', 4, 2) }), trim: lantern({ color: [0.85, 0.83, 0.78] }),
  red: lantern({ map: loader.load('skeleton.png'), color: [1.0, 0.16, 0.12], glow: [0.2, 0.02, 0.01] }), white: lantern({ map: loader.load('skeleton.png'), color: [1.05, 1.02, 0.96], glow: [0.1, 0.1, 0.09] }),
  mist: lantern({ color: [0.05, 0.14, 0.1], full: 1, glow: [0.03, 0.1, 0.07] }),
  black: lantern({ color: [0.01, 0.01, 0.01], full: 1 }), gold: lantern({ color: [0.85, 0.65, 0.15] }),
};
box(X.wood, [2, -0.1, -1], [8, 0.2, 10]); box(X.wall, [-0.45, 1.7, -1], [0.2, 3.4, 10]); box(X.wall, [2, 1.7, -4.6], [8, 3.4, 0.2]);
box(X.trim, [-0.3, 0.5, -1], [0.1, 1, 10]);
const c = group(scene, [0, 0, 0]);
box(X.desk, [0, 1.15, 0], [0.7, 2.3, 1.5], c);
const doorway = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 2.1), X.black); doorway.position.set(0.352, 1.05, 0); doorway.rotation.y = Math.PI / 2; c.add(doorway);
const hinge = group(c, [0.38, 0, 0.66]);
const door = box(X.trim, [0, 1.05, -0.66], [0.05, 2.1, 1.3], hinge);
prim(sphere, X.gold, [0.04, 0, -0.5], [0.07, 0.07, 0.07], door);
{
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 170; const g = cv.getContext('2d');
  g.fillStyle = '#d8d4c8'; g.fillRect(0, 0, 512, 170); g.fillStyle = '#3a1a10'; g.textAlign = 'center';
  g.font = 'bold 72px sans-serif'; g.fillText('CLOSET', 256, 80); g.font = '48px sans-serif'; g.fillText('do not open', 256, 145);
  const t = new THREE.CanvasTexture(cv); const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.25), lantern({ map: t }));
  sign.position.set(0.03, 0.55, 0); sign.rotation.y = Math.PI / 2; door.add(sign);
}
// ---- port of FirWorldBuilder.SkeletonRig: the skeleton model, cut into rigid parts
const partsText = await (await fetch('skeleton_parts.txt')).text();
const parts = []; let cur = null;
for (const raw of partsText.split('\n')) {
  const p = raw.trim().split(' ');
  if (!p[0] || p[0] == '#') continue;
  if (p[0] == 'part') { cur = { name: p[1], parent: p[2], pivot: [+p[3], +p[4], +p[5]], v: [], uv: [], t: [] }; parts.push(cur); }
  else if (p[0] == 'v') { cur.v.push(+p[1], +p[2], +p[3]); cur.uv.push(+p[4], +p[5]); }
  else if (p[0] == 't') cur.t.push(+p[1], +p[2], +p[3]);
}
for (const sp of parts) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(sp.v, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(sp.uv, 2));
  g.setIndex(sp.t); g.computeVertexNormals(); sp.geo = g;
}
function rig(B) {
  const root = group(c, [-0.05, 0, 0]); root.rotation.y = Math.PI / 2;
  const by = {};
  for (const sp of parts) {
    const t = sp.parent == '-' ? root : group(by[sp.parent], sp.pivot);
    t.add(new THREE.Mesh(sp.geo, B)); by[sp.name] = t;
  }
  return [root, by.torso, by.skull, by.upperL, by.upperR, by.foreL, by.foreR, by.legL, by.legR, by.jaw];
}
const whiteSk = rig(X.white), redSk = rig(X.red);
const mist = group(c, [0, 0, 0]);
for (const [x, z, sx, sz, i] of [[0.5, 0.1, 0.9, 0.7, 0], [0.9, -0.35, 0.8, 0.6, 1], [1.0, 0.4, 0.7, 0.55, 2], [1.35, 0, 0.9, 0.7, 3], [1.6, -0.5, 0.6, 0.45, 4], [1.7, 0.55, 0.55, 0.4, 5], [0.9, -1.3, 0.8, 0.9, 6], [0.8, -2.3, 0.7, 0.8, 7]])
  prim(sphere, X.mist, [x, 0.02, z], [sx, 0.08 + 0.03 * (i % 2), sz], mist);
const sub = document.createElement('div');
sub.style.cssText = 'position:absolute;left:0;right:0;bottom:110px;text-align:center;font:600 40px sans-serif;color:#fff;text-shadow:0 0 6px #000,0 0 2px #000';
document.body.appendChild(sub);

// ---- port of FirCloset.cs
const S = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const Ramp = (t, a, b, c2, d) => t < a || t > d ? 0 : t < b ? S((t - a) / (b - a)) : t < c2 ? 1 : 1 - S((t - c2) / (d - c2));
const D = Math.PI / 180, E = (x, y, z) => new THREE.Euler(x * D, y * D, z * D, 'YXZ');
function apply(p, x, z, yaw, bob, lean, hx, hy, hz, shX, shZ, elX, elZ, leg) {
  p[0].position.set(x, bob, z); p[0].rotation.copy(E(0, yaw, 0));
  p[1].rotation.copy(E(lean, 0, 0)); p[2].rotation.copy(E(hx, hy, hz));
  const swing = -0.8 * leg;
  p[3].rotation.copy(E(shX + swing, 0, shZ)); p[4].rotation.copy(E(shX - swing, 0, -shZ));
  p[5].rotation.copy(E(elX, 0, elZ)); p[6].rotation.copy(E(elX, 0, -elZ));
  p[7].rotation.copy(E(leg, 0, 0)); p[8].rotation.copy(E(-leg, 0, 0));
}
const T0 = 0.6;
window.renderAt = (time) => {
  camera.position.set(2.6, 1.45, -0.4); camera.lookAt(0, 1.05, -0.8); camera.updateMatrixWorld();
  const t = time - T0, run = t >= 0 && t <= 9.0;
  mist.visible = run;
  const doorA = !run ? 0 : t < 0.4 ? S(t / 0.4) : t < 8.4 ? 1 : 1 - S((t - 8.4) / 0.4);
  hinge.rotation.set(0, -100 * D * doorA, 0);
  const wOn = run && t < 4.0; whiteSk[0].visible = wOn;
  if (wOn) {
    const wx = -0.05 + 0.8 * S((t - 0.4) / 0.6), wz = t > 2.8 ? -2.6 * (t - 2.8) / 1.2 : 0, yaw = 90 + 90 * S((t - 2.5) / 0.3);
    const walking = (t > 0.4 && t < 1.0) || t > 2.8, sw = walking ? Math.sin(t * 10) : 0, sh = Ramp(t, 1.1, 1.4, 2.2, 2.5);
    apply(whiteSk, wx, wz, yaw, walking ? Math.abs(sw) * 0.03 : 0.04 * sh, 0, 0, 0, 12 * sh, 0, -12 * sh, -100 * sh, -38 * sh, 25 * sw);
  }
  const rOn = run && t >= 2.9 && t < 8.4; redSk[0].visible = rOn;
  if (rOn) {
    const lw = Ramp(t, 3.0, 3.5, 4.0, 4.6), hw = Ramp(t, 4.6, 4.9, 6.2, 6.5), uw = S((t - 6.2) / 0.3);
    const rx = -0.05 + 0.35 * S((t - 3.0) / 0.5) + 0.45 * S((t - 4.0) / 0.6), rz = t > 6.5 ? -3.2 * (t - 6.5) / 1.9 : 0, yaw = 90 + 55 * lw + 90 * uw;
    const walking = (t > 4.0 && t < 4.6) || t > 6.5, sw = walking ? Math.sin(t * 8) : 0;
    apply(redSk, rx, rz, yaw, walking ? Math.abs(sw) * 0.025 : 0, 40 * lw - 5 * hw + 35 * uw, -25 * uw, 25 * lw, -10 * hw,
          -40 * lw - 25 * uw, -40 * hw, -20 * lw - 30 * uw, 100 * hw, -35 * lw + 20 * sw);
  }
  const flap = (from, until) => (t >= from && t < until) ? Math.abs(Math.sin(time * 17)) * (0.6 + 0.4 * Math.sin(time * 5)) : 0;
  whiteSk[9].rotation.set(28 * D * flap(1.21, 2.78), 0, 0);
  redSk[9].rotation.set(28 * D * flap(4.71, 6.63), 0, 0);
  sub.textContent = run && t > 1.21 && t < 3.41 ? 'A skeleton.' : run && t > 4.71 && t < 7.11 ? 'Red skeleton, ha.' : '';
  G.dark.value = 0; G.amb.value = 0.004;
  renderer.render(scene, camera);
  return true;
};
// textures may finish loading while the model file is still being fetched, so wait for whichever is last
window.ready = new Promise(r => {
  const check = () => texturesLoaded ? r(true) : setTimeout(check, 100);
  check();
});
</script></body></html>
